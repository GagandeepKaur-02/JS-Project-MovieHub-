
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - Movie Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .neon-border {
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans relative overflow-x-hidden">

        <!--Navbar  -->
    <nav class="sticky top-0 z-50 border-b border-slate-800 bg-slate-950/70 backdrop-blur-md">
        <div class="container mx-auto px-4 max-w-5xl h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-400 text-transparent bg-clip-text">
                🎬 MOVIEHUB
            </a>
            <div class="flex items-center text-sm font-medium">
                <!-- Javascript code jo bina changes kiye pichle tab par bhejega -->
                <a href="#" onclick="event.preventDefault(); if(window.history.length > 1) { window.history.back(); } else { window.close(); }" class="text-pink-400 border-b-2 border-pink-500 pb-1 cursor-pointer hover:text-pink-300 transition-colors">← Back to Results</a>
            </div>
        </div>
    </nav>

    <!-- Background Decorative Gradients -->
    <div class="absolute top-[20%] left-[-10%] w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[130px] pointer-events-none"></div>
    <div class="absolute bottom-[10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[130px] pointer-events-none"></div>

    <div class="container mx-auto px-4 max-w-5xl relative z-10 pt-8 pb-20">
        
        <!-- Back Button -->
        <a href="index.html" target="_blank" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl border border-slate-800 bg-slate-900/60 backdrop-blur-md text-slate-300 hover:text-white hover:border-cyan-500/50 hover:bg-slate-900 transition-all duration-300 mb-8 group font-medium text-sm">
            <span class="group-hover:-translate-x-1 transition-transform duration-300">←</span> Back to Search
        </a>

        <!-- Main Movie Details Container -->
        <div id="Movie-detail" class="w-full">
            <!-- Initial Loader inside Second Page -->
            <div class="flex justify-center items-center py-32 w-full">
                <!--loader class in style.css -->
                <div class="loader"></div> 
            </div>
        </div>

    </div>

      <!-- Footer -->
    <footer class="w-full border-t border-slate-900 bg-slate-950/40 py-6 mt-auto">
        <div
            class="container mx-auto px-4 max-w-6xl flex  sm:flex-row items-center justify-between gap-4 text-sm text-slate-500">
            <div>
                © 2026 Movie Hub. All rights reserved.
            </div>

            <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-500 font-light">Designed & Coded by</span>
                <span
                    class="text-pink-400 font-extrabold tracking-wider border-b border-pink-500/30 pb-0.5 shadow-pink-500/10 drop-shadow-sm">
                    ✨ GAGANDEEP KAUR
                </span>
            </div>

        </div>
    </footer>

    <script src="movieDetails.js"></script>
</body>
</html>
